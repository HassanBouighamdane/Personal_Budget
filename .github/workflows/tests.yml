# Tests à chaque push sur `preview` et sur chaque Pull Request vers `master` :
# le frontend (types + build) et le backend (calculs sans base, puis tests sur la base de preview).
# Le déploiement reste fait par Vercel ; ce workflow dit seulement si le code est bon.
name: Tests

on:
  push:
    branches: [preview]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Build
        run: npx vite build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FUSEAU: Africa/Casablanca
      # Secret GitHub : l'URL de la branche Neon de preview (jamais celle de production)
      DATABASE_URL_TESTS: ${{ secrets.DATABASE_URL_TESTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests sans base
        run: pytest -m "not base" -q
        env:
          DATABASE_URL: postgresql://sans-base@localhost/sans-base
      - name: Mise à jour de la base de preview (tables et colonnes du code testé)
        if: env.DATABASE_URL_TESTS != ''
        run: python -c "from database import init_db; init_db()"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TESTS }}
      - name: Tests sur la base de preview
        if: env.DATABASE_URL_TESTS != ''
        run: pytest -m base -q
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TESTS }}
