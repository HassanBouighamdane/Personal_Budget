# Tests à chaque push sur `preview` et sur chaque Pull Request vers `master` :
# le frontend (types + build) et le backend (tests sans base ; ceux qui écrivent en base sont sautés).
# Le déploiement reste fait par Vercel ; ce workflow dit seulement si le code est bon.
name: Tests

on:
  push:
    branches: [preview]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Build
        run: npx vite build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FUSEAU: Africa/Casablanca
      # Pas de TEST_DATABASE_URL : les tests de base sont sautés (cf. tests/conftest.py), seuls les
      # calculs sans base tournent ici. Les tests de base se lancent à la main, sur une base de test.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-tests.txt
      - name: Tests (sans base)
        run: pytest -q -rs
