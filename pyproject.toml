# Configuration lue par Vercel (cf. DEPLOY_VERCEL.md). En local, on installe backend/requirements.txt :
# les deux listes de dépendances doivent rester identiques (vérifié par backend/tests/test_deploiement.py),
# à pytest près, qui ne sert pas sur Vercel.
[project]
name = "mon-budget"
version = "2.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "psycopg[binary]",
    "psycopg-pool>=3.2",
    "python-dotenv",
    "tzdata",
]

[tool.vercel]
# L'application FastAPI : variable `app` du fichier backend/app.py
entrypoint = "backend.app:app"

[tool.vercel.scripts]
# Construit le frontend (frontend-react/dist, non versionné) à chaque déploiement, après
# l'installation des paquets Python. Ne pas définir de « Build Command » dans le tableau de bord
# Vercel ni dans vercel.json : elle remplacerait ce script.
build = "python backend/construire_frontend.py"
